name: Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: ZIP'i ac
        run: |
          unzip -q TestLab.zip
          ls TestLab

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK paketleri
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Debug APK derle
        working-directory: TestLab
        run: gradle :app:assembleDebug --stacktrace

      - name: APK'yi Artifacts bolumune yukle
        uses: actions/upload-artifact@v4
        with:
          name: TestLab-debug-apk
          path: TestLab/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Birim testleri
        working-directory: TestLab
        run: gradle :app:testDebugUnitTest --stacktrace
        continue-on-error: true
